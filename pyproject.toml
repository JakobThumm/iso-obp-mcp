[project]
name = "iso-obp-mcp"
version = "0.1.0"
description = "MCP server for looking up ISO term definitions from the ISO OBP / Glossarist terminology corpora"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
iso-obp-mcp = "iso_obp_mcp.server:main"
iso-obp-index = "iso_obp_mcp.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iso_obp_mcp"]
